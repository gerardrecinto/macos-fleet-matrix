[package]
name = "mfm-reaper"
version = "0.1.0"
edition = "2021"
description = "Fail-closed lease reaper for the macOS Fleet Matrix control plane"
license = "MIT"

[[bin]]
name = "mfm-reaper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
