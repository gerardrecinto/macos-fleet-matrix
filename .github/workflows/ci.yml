name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Build control-plane container
        run: docker build --pull --tag mfm:test .
      - name: Smoke test control-plane container
        run: docker run --rm mfm:test inventory sample

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mfm/Reaper
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [aws, gcp, azure, openstack, alicloud]
    defaults:
      run:
        working-directory: terraform/control-plane/${{ matrix.provider }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_wrapper: false
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Reject obvious credential material
        run: |
          if grep -RniE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----' --exclude-dir=.git .; then
            echo 'Potential credential material found.'
            exit 1
          fi
