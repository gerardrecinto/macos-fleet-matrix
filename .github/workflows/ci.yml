name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e1148
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Build control-plane container
        run: docker build --pull --tag mfm:test .
      - name: Smoke test control-plane container
        run: docker run --rm mfm:test inventory sample

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e1148
      - name: Reject obvious credential material
        run: |
          if grep -RniE 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----' --exclude-dir=.git .; then
            echo 'Potential credential material found.'
            exit 1
          fi
