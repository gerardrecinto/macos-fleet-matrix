apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../control-plane

# OpenShift's restricted-v2 SCC assigns each namespace a UID range and rejects
# a pod that pins runAsUser/runAsGroup outside it. Drop the fixed IDs from the
# base CronJob and let the SCC pick them; runAsNonRoot and the rest of the
# restricted profile stay in place.
patches:
  - target:
      kind: CronJob
      name: mfm-control-plane-smoke-check
    patch: |-
      - op: remove
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsUser
      - op: remove
        path: /spec/jobTemplate/spec/template/spec/securityContext/runAsGroup
