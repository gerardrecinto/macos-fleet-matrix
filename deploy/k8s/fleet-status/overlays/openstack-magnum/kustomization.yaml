apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Magnum: an internal Octavia load balancer in front of the Service, image from a private registry.
resources:
  - ../../base

images:
  - name: ghcr.io/gerardrecinto/fleet-status
    newName: registry.example.internal/fleet-matrix/fleet-status
    newTag: "0.1.0"

patches:
  - target:
      kind: Service
      name: fleet-status
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /metadata/annotations
        value:
          service.beta.kubernetes.io/openstack-internal-load-balancer: "true"
