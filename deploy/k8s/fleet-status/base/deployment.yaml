apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-status
  labels:
    app.kubernetes.io/name: fleet-status
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet-status
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-status
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fleet-status
          image: fleet-status
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MFM_STATE_FILE
              value: /data/state.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: state
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          configMap:
            name: fleet-state
        - name: tmp
          emptyDir: {}
