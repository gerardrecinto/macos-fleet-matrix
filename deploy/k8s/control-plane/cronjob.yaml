apiVersion: batch/v1
kind: CronJob
metadata:
  name: mfm-control-plane-smoke-check
  namespace: mfm-control-plane
  labels:
    app.kubernetes.io/name: macos-fleet-matrix
    app.kubernetes.io/component: control-plane
spec:
  # The control plane is a CLI, not a long-running server (see the root
  # README's "Container image" section) — there is nothing to run as a
  # Deployment. This CronJob is the Kubernetes-native equivalent of the
  # systemd oneshot unit the Terraform cloud-init templates install on a VM:
  # it pulls the published image and runs `inventory sample` on a schedule,
  # which is a real smoke test against the real published image, not a
  # placeholder workload.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: macos-fleet-matrix
            app.kubernetes.io/component: control-plane
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mfm
              image: ghcr.io/gerardrecinto/macos-fleet-matrix:latest
              args: ["inventory", "sample"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
