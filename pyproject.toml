[project]
name = "macos-fleet-matrix"
version = "0.1.0"
description = "Ephemeral Apple Silicon macOS CI fleet control-plane reference implementation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mfm = "mfm.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
